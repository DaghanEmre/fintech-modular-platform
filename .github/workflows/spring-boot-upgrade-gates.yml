name: Spring Boot 3.5 Upgrade Validation Gates (ADR-0008)

on:
  push:
    branches: [ main, develop, feature/spring-boot-3.5-upgrade ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline: 6 gates in sequential order, matching ADR-0008 validation pipeline.
# All gates are HARD: no continue-on-error. A failing gate stops the pipeline.
# Soft/advisory behavior is explicitly documented — never implicit.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ─────────────────────────────────────────────────────────────
  # Gate 1 — Dependency Resolution
  # Validates: No old Spring 3.2.x; dependency convergence enforced.
  # ─────────────────────────────────────────────────────────────
  gate-1-dependency-resolution:
    name: "Gate 1 — Dependency Resolution"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Check Spring Boot version in dependency tree
        run: mvn dependency:tree -Dincludes=org.springframework.boot -B

      - name: Run Maven Enforcer via validate phase
        # Direct 'mvn enforcer:enforce' ignores <execution> blocks — rules are lifecycle-bound.
        # Running 'validate' phase correctly triggers enforce-platform-baseline and enforce-banned-namespace.
        run: mvn validate -B

      - name: Upload dependency tree as artifact
        run: mvn dependency:tree > dependency-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: dependency-tree.txt

  # ─────────────────────────────────────────────────────────────
  # Gate 2 — Compile
  # Validates: All modules compile under Java 21 with --release 21.
  # ─────────────────────────────────────────────────────────────
  gate-2-compile:
    name: "Gate 2 — Compile"
    runs-on: ubuntu-latest
    needs: gate-1-dependency-resolution
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile all modules
        run: mvn clean compile -DskipTests=true -B -V

  # ─────────────────────────────────────────────────────────────
  # Gate 3 — Architecture Integrity (ArchUnit)
  # HARD gate: architectural violations fail the build.
  # Validates: Hexagonal boundaries, domain purity, Spec pattern.
  # ─────────────────────────────────────────────────────────────
  gate-3-architecture-integrity:
    name: "Gate 3 — Architecture Integrity (ArchUnit)"
    runs-on: ubuntu-latest
    needs: gate-2-compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Install upstream dependencies (fintech-common)
        # Required on fresh CI runners: fintech-common must be in local repo before customer-service tests.
        # We do NOT use -am here: -am adds fintech-common to the reactor which causes
        # Maven to attempt running -Dtest patterns in ALL reactor modules, failing on fintech-common.
        run: mvn install -pl common/fintech-common -DskipTests -B

      - name: Run ArchUnit tests
        # HARD gate — no continue-on-error. Architecture integrity is a first-class invariant.
        # Runs only on customer-service since fintech-common is already installed above.
        run: mvn test -pl services/customer-service -Dtest="*ArchTest,*ArchitectureTest" -DfailIfNoTests=false -B

  # ─────────────────────────────────────────────────────────────
  # Gate 4 — Behavioral (Spring Boot Jackson + Domain)
  # Validates: Spring Boot runtime serialization contract via @JsonTest.
  # Validates: Domain invariants via unit tests.
  # ─────────────────────────────────────────────────────────────
  gate-4-behavioral:
    name: "Gate 4 — Behavioral (Jackson + Domain)"
    runs-on: ubuntu-latest
    needs: gate-2-compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Install upstream dependencies (fintech-common)
        # Same rationale as Gate 3: prevents -Dtest pattern from running in fintech-common reactor.
        run: mvn install -pl common/fintech-common -DskipTests -B

      - name: Run serialization and domain unit tests
        run: mvn test -pl services/customer-service -Dtest="CustomerStatusSerializationTest,CustomerStatusTest" -B

  # ─────────────────────────────────────────────────────────────
  # Gate 5 — Integration (Testcontainers + PostgreSQL)
  # Validates: JPA mapping, enum round-trip, persistence adapter.
  # Docker is available by default on GitHub-hosted runners.
  # ─────────────────────────────────────────────────────────────
  gate-5-integration:
    name: "Gate 5 — Integration (Testcontainers + DB)"
    runs-on: ubuntu-latest
    needs:
      - gate-3-architecture-integrity
      - gate-4-behavioral
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Verify Docker available (required by Testcontainers)
        run: docker ps

      - name: Run integration tests (customer-service only)
        # Selective -pl avoids running integration tests for unrelated modules.
        run: mvn verify -pl common/fintech-common,services/customer-service -B
        env:
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

      - name: Upload failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: services/customer-service/target/failsafe-reports/

  # ─────────────────────────────────────────────────────────────
  # Gate 6 — Observability Smoke Test
  # Validates: Actuator health, metrics endpoint, Prometheus metrics.
  # Health polling replaces fixed sleep to prevent flaky startup races.
  # ─────────────────────────────────────────────────────────────
  gate-6-observability:
    name: "Gate 6 — Observability Smoke"
    runs-on: ubuntu-latest
    needs: gate-5-integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Package application (skip tests — already verified in Gate 5)
        run: mvn clean package -DskipTests -pl common/fintech-common,services/customer-service -B

      - name: Start customer-service in background
        run: |
          cd services/customer-service
          java -jar target/customer-service-*.jar > /tmp/app.log 2>&1 &
          echo "APP_PID=$!" >> $GITHUB_ENV

      - name: Wait for application readiness (health polling — max 60s)
        # Polling replaces fixed 'sleep 10': handles CI runner variability.
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✅ Application ready on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 2s..."
            sleep 2
          done
          echo "❌ Application failed to start within 60 seconds"
          cat /tmp/app.log
          exit 1

      - name: Gate 6a — Health endpoint is UP
        run: |
          STATUS=$(curl -sf http://localhost:8080/actuator/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "Health status: $STATUS"
          [ "$STATUS" = "UP" ] || (echo "Health is not UP"; exit 1)
          echo "✅ Health endpoint OK"

      - name: Gate 6b — Metrics endpoint reachable
        run: |
          curl -sf http://localhost:8080/actuator/metrics > /dev/null
          echo "✅ Metrics endpoint OK"

      - name: Gate 6c — Core JVM metrics present in Prometheus output
        # Stable grep: 'jvm_memory' prefix is preserved across Micrometer minor versions.
        # Exact metric name (e.g., jvm_memory_used_bytes vs jvm_memory_usage_bytes) may vary.
        run: |
          METRICS=$(curl -sf http://localhost:8080/actuator/prometheus)
          echo "$METRICS" | grep -q "jvm_memory" || (echo "❌ jvm_memory metrics missing from Prometheus output"; exit 1)
          echo "✅ Core JVM metrics present in Prometheus endpoint"

      - name: Gate 6d — Application tag present on metrics
        run: |
          METRICS=$(curl -sf http://localhost:8080/actuator/prometheus)
          echo "$METRICS" | grep -q 'application="customer-service"' || (echo "❌ application metric tag missing"; exit 1)
          echo "✅ Application metric tag present"

      - name: Stop application
        if: always()
        run: kill ${{ env.APP_PID }} || true

  # ─────────────────────────────────────────────────────────────
  # Summary — All Gates Must Pass
  # ─────────────────────────────────────────────────────────────
  summary:
    name: "All Gates Passed ✅"
    runs-on: ubuntu-latest
    needs:
      - gate-1-dependency-resolution
      - gate-2-compile
      - gate-3-architecture-integrity
      - gate-4-behavioral
      - gate-5-integration
      - gate-6-observability
    if: always()
    steps:
      - name: Evaluate all gate results
        run: |
          GATES=(
            "${{ needs.gate-1-dependency-resolution.result }}"
            "${{ needs.gate-2-compile.result }}"
            "${{ needs.gate-3-architecture-integrity.result }}"
            "${{ needs.gate-4-behavioral.result }}"
            "${{ needs.gate-5-integration.result }}"
            "${{ needs.gate-6-observability.result }}"
          )
          FAILED=false
          for GATE in "${GATES[@]}"; do
            if [ "$GATE" = "failure" ] || [ "$GATE" = "cancelled" ]; then
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "❌ One or more Spring Boot upgrade validation gates failed."
            exit 1
          fi
          echo "✅ All 6 Spring Boot 3.5 upgrade validation gates passed. Merge approved."
