name: Spring Boot 3.5 Upgrade Validation Gates (ADR-0008)

on:
  push:
    branches: [ main, develop, feature/spring-boot-3.5-upgrade ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Xmx2g -XX:+UseG1GC'

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline: 6 gates in sequential order, matching ADR-0008 validation pipeline.
# All gates are HARD: no continue-on-error. A failing gate stops the pipeline.
# Soft/advisory behavior is explicitly documented — never implicit.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ─────────────────────────────────────────────────────────────
  # Gate 1 — Dependency Resolution
  # Validates: No old Spring 3.2.x; dependency convergence enforced.
  # ─────────────────────────────────────────────────────────────
  gate-1-dependency-resolution:
    name: "Gate 1 — Dependency Resolution"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Check Spring Boot version in dependency tree
        run: mvn dependency:tree -Dincludes=org.springframework.boot -B

      - name: Run Maven Enforcer via validate phase
        # Direct 'mvn enforcer:enforce' ignores <execution> blocks — rules are lifecycle-bound.
        # Running 'validate' phase correctly triggers enforce-platform-baseline and enforce-banned-namespace.
        run: mvn validate -B

      - name: Upload dependency tree as artifact
        run: mvn dependency:tree > dependency-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: dependency-tree.txt

  # ─────────────────────────────────────────────────────────────
  # Gate 2 — Compile
  # Validates: All modules compile under Java 21 with --release 21.
  # ─────────────────────────────────────────────────────────────
  gate-2-compile:
    name: "Gate 2 — Compile"
    runs-on: ubuntu-latest
    needs: gate-1-dependency-resolution
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile all modules
        run: mvn clean compile -DskipTests=true -B -V

  # ─────────────────────────────────────────────────────────────
  # Gate 3 — Architecture Integrity (ArchUnit)
  # HARD gate: architectural violations fail the build.
  # Validates: Hexagonal boundaries, domain purity, Spec pattern.
  #
  # CRITICAL: Parent POM resolution
  # fintech-common declares parent: fintech-modular-platform (root pom).
  # When customer-service resolves fintech-common dependency, it reads
  # fintech-common.pom and looks for the parent in local Maven repo.
  # Root parent POM must be installed first via: mvn install -N
  # ─────────────────────────────────────────────────────────────
  gate-3-architecture-integrity:
    name: "Gate 3 — Architecture Integrity (ArchUnit)"
    runs-on: ubuntu-latest
    needs: gate-2-compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: "Install root parent POM (aggregator only, no build)"
        # -N = --non-recursive: installs ONLY the root pom.xml to local Maven repo.
        # Does NOT compile or package any child modules.
        #
        # This satisfies the parent reference declared in fintech-common.pom:
        #   <parent>
        #     <artifactId>fintech-modular-platform</artifactId>  ← This POM must exist in local repo
        #   </parent>
        #
        # Without this step, customer-service fails with:
        #   Could not find artifact fintech-modular-platform:pom:0.0.1-SNAPSHOT (absent)
        run: mvn install -N -DskipTests -B

      - name: "Install upstream module artifacts (fintech-common)"
        # Installs fintech-common JAR and POM to local Maven repo.
        # Now that root parent POM is installed (step above), fintech-common's
        # parent reference resolves successfully.
        run: mvn install -pl common/fintech-common -DskipTests -B

      - name: "Run ArchUnit tests in customer-service"
        # HARD gate — architecture is a first-class invariant.
        #
        # At this point:
        # - Root parent POM is in local repo ✅
        # - fintech-common JAR+POM are in local repo ✅
        # - customer-service can resolve fintech-common dependency ✅
        #
        # CRITICAL: Do NOT use -am here.
        # -am (also-make) would re-add fintech-common to the reactor, causing Surefire
        # to apply the -Dtest pattern filter across ALL modules. fintech-common has NO
        # *ArchTest classes → pattern matching fails even with -DfailIfNoTests=false.
        #
        # Solution: Single -pl scope to customer-service only.
        # fintech-common is already in local Maven repo, so dependency resolution works.
        #
        # -DfailIfNoTests=true: ArchUnit tests MUST exist — silent passes are unacceptable.
        run: mvn test \
          -pl services/customer-service \
          -Dtest="*ArchTest,*ArchitectureTest" \
          -DfailIfNoTests=true \
          -B

      - name: "Verify ArchUnit test execution (sanity check)"
        # Ensures tests actually ran (not silently filtered or skipped).
        # Uses find to safely handle glob expansion and stricter grep pattern
        # tests="[1-9] to confirm at least one test was executed.
        run: |
          REPORT_FILES=$(find services/customer-service/target/surefire-reports -name "TEST-*.xml" 2>/dev/null || true)

          if [ -z "$REPORT_FILES" ]; then
            echo "❌ ERROR: No Surefire XML reports found for ArchUnit tests."
            echo "   Verify that *ArchTest or *ArchitectureTest classes exist in:"
            echo "   services/customer-service/src/test/java"
            exit 1
          fi

          if ! grep -q 'tests="[1-9]' $REPORT_FILES; then
            echo "❌ ERROR: Surefire reports exist, but no ArchUnit tests were executed."
            echo "   Expected: tests attribute with value > 0"
            grep 'tests=' $REPORT_FILES || echo "   (no tests= attribute found)"
            exit 1
          fi

          echo "✅ ArchUnit tests executed successfully"
          grep 'tests=' $REPORT_FILES | head -5

  # ─────────────────────────────────────────────────────────────
  # Gate 4 — Behavioral (Spring Boot Jackson + Domain)
  # Validates: Spring Boot runtime serialization contract via @JsonTest.
  # Validates: Domain invariants via unit tests.
  # ─────────────────────────────────────────────────────────────
  gate-4-behavioral:
    name: "Gate 4 — Behavioral (Jackson + Domain)"
    runs-on: ubuntu-latest
    needs: gate-2-compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run all customer-service unit tests
        # Gate 4 runs all unit tests in customer-service and its dependencies for full test coverage.
        # Using -am automatically resolves reactor dependencies (fintech-common) and root POM first.
        # Unlike Gate 3, here we use -am because we want to run ALL test patterns, not a filtered subset.
        run: mvn test -pl services/customer-service -am -B

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-gate4
          path: |
            services/customer-service/target/surefire-reports/
            common/fintech-common/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────
  # Gate 5 — Integration (Testcontainers + PostgreSQL)
  # Validates: JPA mapping, enum round-trip, persistence adapter.
  # Docker is available by default on GitHub-hosted runners.
  # ─────────────────────────────────────────────────────────────
  gate-5-integration:
    name: "Gate 5 — Integration (Testcontainers + DB)"
    runs-on: ubuntu-latest
    needs:
      - gate-3-architecture-integrity
      - gate-4-behavioral
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Verify Docker available (required by Testcontainers)
        run: docker ps

      - name: Run integration tests (customer-service only)
        # Selective -pl avoids running integration tests for unrelated modules.
        # -verify phase includes both unit (-test) and integration (-failsafe) test execution.
        run: mvn verify -pl common/fintech-common,services/customer-service -B
        env:
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

      - name: Upload failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: services/customer-service/target/failsafe-reports/

  # ─────────────────────────────────────────────────────────────
  # Gate 6 — Observability Smoke Test
  # Validates: Actuator health, metrics endpoint, Prometheus metrics.
  # Health polling replaces fixed sleep to prevent flaky startup races.
  # ─────────────────────────────────────────────────────────────
  gate-6-observability:
    name: "Gate 6 — Observability Smoke"
    runs-on: ubuntu-latest
    needs: gate-5-integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Package application (skip tests — already verified in Gate 5)
        run: mvn clean package -DskipTests -pl common/fintech-common,services/customer-service -B

      - name: Start Postgres container for smoke test
        run: |
          docker run --name customer_db \
            -e POSTGRES_DB=customer_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            -d postgres:15

          # Polling for readiness is safer than fixed sleep
          for i in {1..20}; do
            if docker exec customer_db pg_isready -U postgres -d customer_db; then
              echo "✅ Postgres is ready"
              exit 0
            fi
            echo "Attempt $i/20 — waiting for postgres..."
            sleep 2
          done
          echo "❌ Postgres failed to start"
          exit 1

      - name: Start customer-service in background
        run: |
          cd services/customer-service
          java -jar target/customer-service-*.jar \
            --spring.profiles.active=test \
            --server.port=8081 > /tmp/app.log 2>&1 &
          echo "APP_PID=$!" >> $GITHUB_ENV

      - name: Wait for application readiness (health polling — max 60s)
        # Polling replaces fixed 'sleep 10': handles CI runner variability.
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "✅ Application ready on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 2s..."
            sleep 2
          done
          echo "❌ Application failed to start within 60 seconds"
          cat /tmp/app.log
          exit 1

      - name: Gate 6a — Health endpoint is UP
        run: |
          STATUS=$(curl -sf http://localhost:8081/actuator/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "Health status: $STATUS"
          [ "$STATUS" = "UP" ] || (echo "Health is not UP"; exit 1)
          echo "✅ Health endpoint OK"

      - name: Gate 6b — Metrics endpoint reachable
        run: |
          curl -sf http://localhost:8081/actuator/metrics > /dev/null
          echo "✅ Metrics endpoint OK"

      - name: Gate 6c — Core JVM metrics present in Prometheus output
        # Stable grep: 'jvm_memory' prefix is preserved across Micrometer minor versions.
        # Exact metric name (e.g., jvm_memory_used_bytes vs jvm_memory_usage_bytes) may vary.
        run: |
          METRICS=$(curl -sf http://localhost:8081/actuator/prometheus)
          echo "$METRICS" | grep -q "jvm_memory" || (echo "❌ jvm_memory metrics missing from Prometheus output"; exit 1)
          echo "✅ Core JVM metrics present in Prometheus endpoint"

      - name: Gate 6d — Application tag present on metrics
        run: |
          METRICS=$(curl -sf http://localhost:8081/actuator/prometheus)
          echo "$METRICS" | grep -q 'application="customer-service"' || (echo "❌ application metric tag missing"; exit 1)
          echo "✅ Application metric tag present"

      - name: Stop application
        if: always()
        run: |
          kill ${{ env.APP_PID }} || true
          docker stop customer_db || true
          docker rm customer_db || true

      - name: Upload application log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: /tmp/app.log

  # ─────────────────────────────────────────────────────────────
  # Summary — All Gates Must Pass
  # ─────────────────────────────────────────────────────────────
  summary:
    name: "All Gates Passed ✅"
    runs-on: ubuntu-latest
    needs:
      - gate-1-dependency-resolution
      - gate-2-compile
      - gate-3-architecture-integrity
      - gate-4-behavioral
      - gate-5-integration
      - gate-6-observability
    if: always()
    steps:
      - name: Evaluate all gate results
        run: |
          GATES=(
            "${{ needs.gate-1-dependency-resolution.result }}"
            "${{ needs.gate-2-compile.result }}"
            "${{ needs.gate-3-architecture-integrity.result }}"
            "${{ needs.gate-4-behavioral.result }}"
            "${{ needs.gate-5-integration.result }}"
            "${{ needs.gate-6-observability.result }}"
          )
          FAILED=false
          for GATE in "${GATES[@]}"; do
            if [ "$GATE" = "failure" ] || [ "$GATE" = "cancelled" ]; then
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "❌ One or more Spring Boot upgrade validation gates failed."
            exit 1
          fi
          echo "✅ All 6 Spring Boot 3.5 upgrade validation gates passed. Merge approved."
