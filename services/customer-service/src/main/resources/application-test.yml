# Packaged test profile for CI smoke runs.
# Unit/integration tests use src/test/resources/application-test.yml.
spring:
  datasource:
    # Gate 6 starts PostgreSQL explicitly, so the packaged jar must use the
    # regular PostgreSQL driver instead of the Testcontainers JDBC proxy.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customer_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Test-specific actuator - only health
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Test logging - minimal
logging:
  level:
    root: WARN
    "[com.daghanemre.fintech.customer]": INFO
