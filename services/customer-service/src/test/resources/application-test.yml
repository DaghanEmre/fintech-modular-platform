spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:tc:postgresql:///test_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          "[batch_size]": 20
        "[order_inserts]": true
        "[order_updates]": true

# Actuator configuration for integration tests
# Exposes observability endpoints to verify contracts (ADR-0008: Observability Gate)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      jvm: true
      process: true
      system: true
    tags:
      application: customer-service
  # Spring Boot 3.3+: simple metrics export namespace moved
  simple:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true

# Test logging
logging:
  level:
    root: INFO
    "[com.daghanemre.fintech]": DEBUG
    "[org.springframework.data]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
