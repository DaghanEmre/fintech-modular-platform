spring:
  application:
    name: customer-service
  datasource:
    # Testcontainers JDBC URL format: jdbc:tc:<database>:<version>/<dbname>
    # The tc: prefix signals the Testcontainers proxy driver to provision the container.
    # Malformed paths (e.g. ///test_db) cause "Cannot create JDBC connection" at test startup.
    url: jdbc:tc:postgresql:15/testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # PostgreSQL15Dialect aligns with testcontainers-bom postgres:15 image
        dialect: org.hibernate.dialect.PostgreSQL15Dialect
        jdbc:
          "[batch_size]": 20
        "[order_inserts]": true
        "[order_updates]": true

# Actuator configuration for integration tests
# Exposes observability endpoints to verify contracts (ADR-0008: Observability Gate)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      jvm: true
      process: true
      system: true
    tags:
      application: customer-service
  # Spring Boot 3.3+: simple metrics export namespace moved
  simple:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true

# Test logging
logging:
  level:
    root: INFO
    "[com.daghanemre.fintech]": DEBUG
    "[org.springframework.data]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
