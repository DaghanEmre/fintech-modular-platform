spring:
  application:
    name: customer-service
  datasource:
    # Testcontainers JDBC URL format: jdbc:tc:<database>:<version>/<dbname>
    # The tc: prefix triggers the Testcontainers proxy driver to spin up the container.
    # Container lifecycle is managed by the JDBC driver — no @Testcontainers annotation needed.
    url: jdbc:tc:postgresql:15/testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # Spring Boot 3.5 + Hibernate 6 auto-detects dialect from JDBC metadata.
        # Explicit PostgreSQL15Dialect removed: causes version lock and drift risk.
        format_sql: true
        use_sql_comments: true
        jdbc:
          "[batch_size]": 20
        "[order_inserts]": true
        "[order_updates]": true

# Actuator configuration for integration tests
# Exposes endpoints to verify observability contracts (ADR-0008: Gate 6)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      jvm: true
      process: true
      system: true
    tags:
      application: customer-service
  # Spring Boot 3.3+ metrics export namespace (migrated from management.metrics.export.simple)
  simple:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true

# Test logging
logging:
  level:
    root: INFO
    "[com.daghanemre.fintech]": DEBUG
    "[org.springframework.data]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
